<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steppe by Steppe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --ground:#eceff3; --surface:#fbfcfd; --ink:#16203a; --muted:#5d6884; --faint:#8c96ab;
  --land:#dce2ea; --land-line:#9fabbf; --region-line:#b9c3d3; --hair:#d3d9e3;
  --accent:#2b4bb3; --accent-ink:#ffffff; --accent-soft:#dfe6fb;
  --g0:#2f9e61; --g1:#e1b01c; --g2:#e5792b; --g3:#d24a4a; --hint:#7a4fd0;
  --win:#2f9e61; --lose:#c2413f;
  --label:#16203a; --label-halo:rgba(251,252,253,.92); --scrim:rgba(236,239,243,.72);
  --shadow:0 1px 2px rgba(22,32,58,.06),0 8px 24px rgba(22,32,58,.07);
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0f1522; --surface:#161e30; --ink:#e7ecf6; --muted:#9aa5bd; --faint:#6e7a93;
    --land:#1d273b; --land-line:#4a5873; --region-line:#34415a; --hair:#27324a;
    --accent:#7c98ff; --accent-ink:#0f1522; --accent-soft:#232f52;
    --g0:#3dbb76; --g1:#f0c33a; --g2:#f08b42; --g3:#e86161; --hint:#a98bff;
    --win:#3dbb76; --lose:#e86161;
    --label:#eef2fa; --label-halo:rgba(15,21,34,.9); --scrim:rgba(15,21,34,.66);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0f1522; --surface:#161e30; --ink:#e7ecf6; --muted:#9aa5bd; --faint:#6e7a93;
  --land:#1d273b; --land-line:#4a5873; --region-line:#34415a; --hair:#27324a;
  --accent:#7c98ff; --accent-ink:#0f1522; --accent-soft:#232f52;
  --g0:#3dbb76; --g1:#f0c33a; --g2:#f08b42; --g3:#e86161; --hint:#a98bff;
  --win:#3dbb76; --lose:#e86161;
  --label:#eef2fa; --label-halo:rgba(15,21,34,.9); --scrim:rgba(15,21,34,.66);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:18px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.2vw,32px);letter-spacing:-.01em;margin:0;line-height:1.05}
h1 span{color:var(--accent)}
.tag{color:var(--muted);margin:4px 0 0;font-size:13.5px}
.hctl{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.brief{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.route{font-size:clamp(17px,2.6vw,22px);font-weight:600;text-wrap:balance;margin:0}
.route .pt{color:var(--accent)}
.route .arrow{color:var(--faint);font-weight:400;margin:0 .25em}
.cc{font:600 10.5px var(--body);letter-spacing:.08em;color:var(--muted);border:1px solid var(--hair);border-radius:4px;padding:1px 4px;vertical-align:3px;margin-left:4px}
.counts{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.count{display:flex;flex-direction:column;align-items:flex-end}
.count b{font-family:var(--display);font-size:22px;font-weight:500;line-height:1}
.count small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.mapbox{scroll-margin-top:12px;position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mapwrap{position:relative;touch-action:none}
svg#map{display:block;width:100%;height:auto;max-height:64vh;aspect-ratio:1000/770;cursor:grab;user-select:none;-webkit-user-select:none}
svg#map.drag{cursor:grabbing}
.ctry{fill:var(--land);stroke:var(--land-line);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.r{fill:transparent;stroke:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .35s}
.borders .r{stroke:var(--region-line);stroke-width:.7}
.r.on{stroke:var(--surface);stroke-width:1;cursor:pointer}
.r.start,.r.end{fill:var(--accent)}
.r.s0{fill:var(--g0)} .r.s1{fill:var(--g1)} .r.s2{fill:var(--g2)} .r.s3{fill:var(--g3)}
.r.hinted{fill:transparent;stroke:var(--hint);stroke-width:2;stroke-dasharray:5 4}
.r.sol{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6;stroke-dasharray:4 3;cursor:pointer}
.r.focus{stroke:var(--ink);stroke-width:2.2}
.dot{stroke:var(--surface);vector-effect:non-scaling-stroke;stroke-width:1.2;cursor:pointer}
.lbl{font-family:var(--body);font-weight:600;fill:var(--label);paint-order:stroke;stroke:var(--label-halo);stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoom button{width:34px;height:34px;border-radius:9px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);font:600 17px var(--body);cursor:pointer;display:grid;place-items:center}
.legend{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:5px 9px;border-radius:8px;border:1px solid var(--hair);max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* fact line */
.fact{position:absolute;left:10px;top:10px;max-width:min(380px,calc(100% - 64px));background:var(--surface);border:1px solid var(--hair);border-radius:10px;box-shadow:var(--shadow);padding:8px 8px 8px 12px;display:flex;gap:8px;align-items:flex-start;z-index:2;font-size:14px;line-height:1.4}
.fact p{margin:0}
.fact b{color:var(--accent);font-weight:700}
.fact .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 2px;margin-top:1px}

/* result overlay */
.over{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px;z-index:3}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;border-top:6px solid var(--win)}
.panel.lost{border-top-color:var(--lose)}
.panel .kick{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--win)}
.panel.lost .kick{color:var(--lose)}
.panel h2{font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,28px);margin:0;line-height:1.1}
.panel p{margin:0;color:var(--muted)}
.panel pre{margin:0;font:500 14px/1.5 var(--body);background:var(--ground);border-radius:9px;padding:10px 12px;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{border:0;background:none;color:var(--muted);font:600 13.5px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 2px}

.play{display:flex;gap:8px;flex-wrap:wrap}
.field{position:relative;flex:1 1 280px}
.field input{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--hair);border-radius:11px;padding:12px 14px;outline:none}
.field input:focus{border-color:var(--accent)}
.sugg{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--hair);border-radius:11px;box-shadow:var(--shadow);list-style:none;margin:0;padding:4px;z-index:5;max-height:300px;overflow:auto}
.sugg li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;cursor:pointer}
.sugg li[aria-selected="true"]{background:var(--accent-soft)}
.sugg .loc{color:var(--muted);font-size:12.5px;text-align:right}
.btn{font:600 14.5px var(--body);border-radius:11px;padding:0 16px;min-height:46px;cursor:pointer;border:1.5px solid var(--hair);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.donebar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--hair);border-left:6px solid var(--win);border-radius:11px;padding:8px 8px 8px 14px}
.donebar.lost{border-left-color:var(--lose)}
.donebar b{flex:1 1 200px;font-size:15px}
.msg{min-height:20px;font-size:13.5px;color:var(--muted);margin:-4px 2px 0}
.msg.err{color:var(--g3)}
.guesses{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.guesses li{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:5px 11px 5px 7px;font-size:13.5px;font-weight:500;cursor:pointer}
.guesses li i{width:12px;height:12px;border-radius:50%}
.guesses li.h{cursor:default}
.guesses li.h i{background:transparent;border:2px dashed var(--hint)}
.toggles{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toggles input{accent-color:var(--accent);width:16px;height:16px}
details.box{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:12px 16px}
details.box > summary{cursor:pointer;font-weight:600}
details.box p,details.box li{color:var(--muted);font-size:14px;max-width:72ch}
details.box ul{padding-left:18px}
.divtable{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%;min-width:420px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.l{color:var(--muted)}
.ctylist{display:flex;flex-direction:column;gap:6px}
.ctylist details{border-radius:10px;background:var(--ground);border:1px solid var(--hair)}
.ctylist summary{padding:9px 14px;display:flex;justify-content:space-between;gap:10px;list-style:none;cursor:pointer;font-weight:600}
.ctylist summary::-webkit-details-marker{display:none}
.ctylist summary::before{content:"▸";color:var(--faint);margin-right:8px;transition:transform .2s;display:inline-block}
.ctylist details[open] summary::before{transform:rotate(90deg)}
.ctylist summary span{flex:1}
.ctylist summary small{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.ctylist .divtable{padding:0 14px 10px}
@media (max-width:640px){
  .counts{gap:14px}.count b{font-size:19px}.legend{font-size:10.5px;gap:7px}
  .fact{position:static;max-width:none;border:0;border-top:1px solid var(--hair);border-radius:0;box-shadow:none}
}
@media (prefers-reduced-motion:reduce){.r{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="h1"></h1>
      <p class="tag" data-t="tagline"></p>
    </div>
    <div class="hctl">
      <div class="seg" role="group" aria-label="Game mode">
        <button id="mDaily" aria-pressed="true" data-t="daily"></button>
        <button id="mPractice" aria-pressed="false" data-t="practice"></button>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button id="lEn" aria-pressed="true" lang="en">EN</button>
        <button id="lRu" aria-pressed="false" lang="ru">RU</button>
      </div>
    </div>
  </header>

  <div class="brief">
    <p class="route" id="route"></p>
    <div class="counts">
      <div class="count"><b id="cShort">–</b><small data-t="shortest"></small></div>
      <div class="count"><b id="cLeft">–</b><small data-t="left"></small></div>
    </div>
  </div>

  <div class="mapbox" id="mapbox">
    <div class="mapwrap">
      <svg id="map" viewBox="0 0 1000 770" role="img" aria-label="Map of Central Asian regions">
        <g id="gCtry"></g><g id="gReg"></g><g id="gDots"></g><g id="gLbl"></g>
      </svg>
      <div class="zoom">
        <button id="zIn" aria-label="Zoom in">+</button>
        <button id="zOut" aria-label="Zoom out">−</button>
        <button id="zFit" aria-label="Fit route" style="font-size:13px">⤢</button>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i style="background:var(--g0)"></i><span data-t="lg0"></span></span>
        <span><i style="background:var(--g1)"></i><span data-t="lg1"></span></span>
        <span><i style="background:var(--g2)"></i><span data-t="lg2"></span></span>
        <span><i style="background:var(--g3)"></i><span data-t="lg3"></span></span>
      </div>
      <div class="over" id="over" hidden>
        <div class="panel" id="panel" role="dialog" aria-labelledby="rTitle">
          <div class="kick" id="rKick"></div>
          <h2 id="rTitle"></h2>
          <p id="rText"></p>
          <pre id="rShare"></pre>
          <div class="row">
            <button class="btn primary" id="copy" type="button"></button>
            <button class="btn" id="next" type="button"></button>
            <button class="linkbtn" id="seeMap" type="button" data-t="seeMap"></button>
          </div>
        </div>
      </div>
    </div>
    <aside class="fact" id="fact" hidden aria-live="polite"></aside>
  </div>

  <form class="play" id="form" autocomplete="off">
    <div class="field">
      <input id="guess" type="text" aria-autocomplete="list" aria-controls="sugg" spellcheck="false">
      <ul class="sugg" id="sugg" role="listbox" hidden></ul>
    </div>
    <button class="btn primary" id="go" type="submit" data-t="guessBtn"></button>
    <button class="btn" id="hint" type="button" data-t="hintBtn"></button>
    <button class="btn" id="bordersBtn" type="button"></button>
    <button class="btn" id="giveup" type="button" data-t="giveUp"></button>
  </form>
  <div class="donebar" id="donebar" hidden>
    <b id="doneText"></b>
    <button class="btn" id="showRes" type="button" data-t="showResult"></button>
    <button class="btn primary" id="next2" type="button"></button>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>

  <ul class="guesses" id="guesses"></ul>

  <div class="toggles">
    <label><input type="checkbox" id="tLabels" checked> <span data-t="labels"></span></label>
    <label><input type="checkbox" id="tFacts" checked> <span data-t="factsToggle"></span></label>
  </div>

  <details class="box"><summary data-t="howTitle"></summary><div id="how"></div></details>
  <details class="box"><summary data-t="listTitle"></summary><div id="about"></div><div id="divs" class="ctylist"></div></details>
</div>

  btw:"Кстати,",close:"Закрыть",regions:n=>`${n} ${plural(n,"регион","региона","регионов")}`,thR:"Регион",thL:"Официальное местное название",thC:"Центр",
  how:`<ul>
<li>Соедините два синих региона цепочкой регионов, у которых есть общая сухопутная граница. Вводите промежуточные регионы в любом порядке.</li>
<li>Цвет показывает, насколько регион далёк от кратчайшего пути: <b style="color:var(--g0)">зелёный</b> — на нём, <b style="color:var(--g1)">жёлтый</b> — +1 шаг, <b style="color:var(--g2)">оранжевый</b> — +2, <b style="color:var(--g3)">красный</b> — +3 и больше.</li>
<li>Попыток — длина кратчайшего пути плюс четыре. <b>Подсказка</b> обводит регион на лучшем оставшемся пути. <b>Показать границы</b> открывает контуры всех регионов до конца игры. Попыток они не тратят, но видны в результате (💡 и 🗺️).</li>
<li>После каждого хода — короткий факт о регионе. Нажмите на любой цветной регион, чтобы узнать ещё один.</li>
<li>Границы между странами тоже считаются. Города с особым статусом (Астана, Бишкек, Душанбе, Ташкент, Ашхабад, Аркадаг и другие) — отдельные остановки; большинство из них окружены одним регионом и соединяются только с ним.</li>
<li>Можно вводить русские, английские и официальные местные названия, а также старые варианты (Жамбыл, Навоий, Согд, Нур-Султан…).</li></ul>`,
  about:`<p>Действующее административное деление первого уровня на сентябрь 2026 года, включая реформу 2022 года в Казахстане (Абайская, Жетысуская и Улытауская области) и туркменский Аркадаг, получивший в 2023 году статус города государственного значения. Рядом с русским названием приведено официальное название на государственном языке.</p>
<p>Рейтинги по площади и населению в фактах основаны на официальных площадях и данных национальных статистических служб (stat.gov.kz, stat.gov.kg, stat.tj, stat.uz) и переписи Туркменистана 2022 года. Границы: © участники OpenStreetMap (ODbL), упрощены.</p>`}
};
let LANG=(store.get("sbs-prefs")||{}).lang||((navigator.language||"").startsWith("ru")?"ru":"en");
const L=()=>T[LANG];
const nm=id=>LANG==="ru"?R[id].ru:R[id].en;
function short(id){const r=R[id];if(LANG==="ru"){const m={"TJ-GB":"ГБАО","TJ-RA":"РРП","UZ-QR":"Каракалпакстан"};return m[id]||r.ru.replace(/ область$/," обл.").replace(/ велаят$/," вел.")}
  return r.en.replace(/ Region$/,"").replace(/^Republic of /,"").replace(/ Autonomous Region$/,"")}
const fmt=n=>new Intl.NumberFormat(LANG==="ru"?"ru-RU":"en-US").format(n);

// ---- graph ----
const D={};
for(const s of IDS){const d={[s]:0},q=[s];while(q.length){const u=q.shift();for(const v of R[u].n)if(!(v in d)){d[v]=d[u]+1;q.push(v)}}D[s]=d}
const excess=(a,b,x)=>D[a][x]+D[x][b]-D[a][b];
function connected(a,b,set){const seen=new Set([a]),q=[a];while(q.length){const u=q.shift();if(u===b)return true;for(const v of R[u].n)if(set.has(v)&&!seen.has(v)){seen.add(v);q.push(v)}}return false}
function bestPath(a,b,known){const cost={},prev={},dq=[a];cost[a]=0;
  while(dq.length){const u=dq.shift();for(const v of R[u].n){const w=cost[u]+(known.has(v)?0:1);if(!(v in cost)||w<cost[v]){cost[v]=w;prev[v]=u;known.has(v)?dq.unshift(v):dq.push(v)}}}
  const p=[];for(let u=b;u!==a;u=prev[u])p.unshift(u);p.pop();return p}

// ---- search (English, Russian, local names and aliases) ----
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/ё/g,"е").replace(/[ʻʼ'’‘`\-.\s]/g,"");
const STRIP=/(^|\s)(region|oblast|oblysy|oblusu|viloyati|welayaty|province|city|shahri|shaary|sheheri|republic of|respublikasi|область|облысы|облусу|велаят|республика|город)(?=\s|$)/gi;
const KEYS={};
for(const id of IDS){const r=R[id];const en=r.en.replace(/ Region$/,"").replace(/^Republic of /,"");
  KEYS[id]=[...new Set([r.en,r.local,r.ru,en,...r.aliases,r.en.replace(STRIP," "),r.local.replace(STRIP," "),r.ru.replace(STRIP," ")].map(norm).filter(Boolean))]}
function search(q){const nq=norm(q),n2=norm(q.replace(STRIP," "));if(!nq)return[];
  const out=[];for(const id of IDS){let best=9;for(const k of KEYS[id])for(const t of [nq,n2]){if(!t)continue;
    if(k===t)best=Math.min(best,0);else if(k.startsWith(t))best=Math.min(best,1);else if(k.includes(t))best=Math.min(best,3)}
    if(best<9)out.push([best,id])}
  out.sort((a,b)=>a[0]-b[0]||nm(a[1]).length-nm(b[1]).length||nm(a[1]).localeCompare(nm(b[1])));return out.slice(0,8).map(x=>x[1])}

// ---- map ----
const svg=$("map"),gR=$("gReg"),gD=$("gDots"),gL=$("gLbl");
for(const cc in DATA.countries){const p=document.createElementNS(NS,"path");p.setAttribute("d",DATA.countries[cc]);p.setAttribute("class","ctry");$("gCtry").appendChild(p)}
const area=id=>{const b=R[id].b;return (b[2]-b[0])*(b[3]-b[1])};
const EL={};
for(const id of [...IDS].sort((a,b)=>area(b)-area(a))){const p=document.createElementNS(NS,"path");p.setAttribute("d",R[id].d);p.setAttribute("class","r");p.dataset.id=id;gR.appendChild(p);EL[id]=p}
const SMALL=id=>{const b=R[id].b;return Math.max(b[2]-b[0],b[3]-b[1])<9};

let vb={x:0,y:0,w:1000,h:770};
function setVB(v){v.w=Math.max(40,Math.min(1300,v.w));v.h=v.w*0.77;
  v.x=Math.max(-200,Math.min(1000-v.w+200,v.x));v.y=Math.max(-160,Math.min(770-v.h+160,v.y));vb=v;
  svg.setAttribute("viewBox",`${v.x} ${v.y} ${v.w} ${v.h}`);scaleMarks()}
function fitTo(ids,pad=0.18){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const id of ids){const b=R[id].b;x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[2]);y1=Math.max(y1,b[3])}
  let w=Math.max(x1-x0,(y1-y0)/0.77,150);w*=1+pad*2;const h=w*0.77;setVB({x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h})}
function zoomAt(f,cx,cy){const w=vb.w*f;if(w<40||w>1300)return;setVB({x:cx-(cx-vb.x)*f,y:cy-(cy-vb.y)*f,w,h:w*0.77})}
function toSvg(e){const r=svg.getBoundingClientRect();return[vb.x+(e.clientX-r.left)/r.width*vb.w,vb.y+(e.clientY-r.top)/r.height*vb.h]}
svg.addEventListener("wheel",e=>{e.preventDefault();const[x,y]=toSvg(e);zoomAt(e.deltaY>0?1.18:1/1.18,x,y)},{passive:false});
const ptrs=new Map();let moved=0,downTarget=null;
svg.addEventListener("pointerdown",e=>{downTarget=e.target;svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);svg.classList.add("drag");moved=0});
svg.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const r=svg.getBoundingClientRect();const prev=ptrs.get(e.pointerId);
  moved+=Math.abs(e.clientX-prev[0])+Math.abs(e.clientY-prev[1]);
  if(ptrs.size===1){setVB({...vb,x:vb.x-(e.clientX-prev[0])/r.width*vb.w,y:vb.y-(e.clientY-prev[1])/r.height*vb.h})}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d0=Math.hypot(a[0]-b[0],a[1]-b[1]);ptrs.set(e.pointerId,[e.clientX,e.clientY]);const [c,dd]=[...ptrs.values()];const d1=Math.hypot(c[0]-dd[0],c[1]-dd[1]);
    if(d0>0&&d1>0){const mx=(c[0]+dd[0])/2,my=(c[1]+dd[1])/2;zoomAt(d0/d1,vb.x+(mx-r.left)/r.width*vb.w,vb.y+(my-r.top)/r.height*vb.h)}return}
  ptrs.set(e.pointerId,[e.clientX,e.clientY])});
const up=e=>{const was=ptrs.size;ptrs.delete(e.pointerId);if(!ptrs.size)svg.classList.remove("drag");
  if(e.type==="pointerup"&&was===1&&moved<6&&downTarget){const id=downTarget.dataset&&downTarget.dataset.id;if(id&&isShown(id))showFact(id)}};
svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
$("zIn").onclick=()=>zoomAt(1/1.4,vb.x+vb.w/2,vb.y+vb.h/2);
$("zOut").onclick=()=>zoomAt(1.4,vb.x+vb.w/2,vb.y+vb.h/2);
$("zFit").onclick=()=>fitTo([G.start,G.end,...G.guesses,...G.hints]);
function scaleMarks(){const k=vb.w/Math.max(svg.clientWidth,300);
  for(const c of gD.children)c.setAttribute("r",5.5*k);
  for(const t of gL.children){t.setAttribute("font-size",12*k);t.setAttribute("stroke-width",3*k)}}

// ---- game ----
const DAY0=Date.UTC(2026,8,25);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const dayNo=s=>{const[y,m,d]=s.split("-").map(Number);return Math.round((Date.UTC(y,m-1,d)-DAY0)/864e5)+1};
function rng(seed){let a=0;for(const ch of seed)a=Math.imul(a^ch.charCodeAt(0),2654435761)>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PAIRS=[];for(const a of IDS)for(const b of IDS)if(a<b&&D[a][b]>=3&&D[a][b]<=8)PAIRS.push([a,b]);
function pick(rand){const [a,b]=PAIRS[Math.floor(rand()*PAIRS.length)];return rand()<.5?[a,b]:[b,a]}

let G, factId=null, factIdx=0, overlayOpen=false;
const maxG=()=>D[G.start][G.end]-1+4;
const known=()=>new Set([G.start,G.end,...G.guesses]);
const solution=()=>G.done&&!G.won?new Set(bestPath(G.start,G.end,known())):new Set();
const isShown=id=>id===G.start||id===G.end||G.guesses.includes(id)||solution().has(id);
function newGame(mode){
  if(mode==="daily"){const t=today();const saved=store.get("sbs-daily");
    if(saved&&saved.date===t&&R[saved.start]){G=saved}else{const[s,e]=pick(rng("sbs-"+t));G={mode,date:t,start:s,end:e,guesses:[],hints:[],done:false,won:false}}}
  else{const[s,e]=pick(Math.random);G={mode,start:s,end:e,guesses:[],hints:[],done:false,won:false}}
  $("mDaily").setAttribute("aria-pressed",mode==="daily");$("mPractice").setAttribute("aria-pressed",mode!=="daily");
  $("guess").value="";closeSugg();msg("");hideFact();overlayOpen=G.done;render();fitTo(G.done?[G.start,G.end,...G.guesses]:[G.start,G.end]);
}
function save(){if(G.mode==="daily")store.set("sbs-daily",G)}

function guess(id){
  if(G.done)return;
  if(id===G.start||id===G.end){msg(L().already(nm(id)),true);return}
  if(G.guesses.includes(id)){msg(L().dup(nm(id)),true);return}
  G.guesses.push(id);G.hints=G.hints.filter(h=>h!==id);
  const ex=excess(G.start,G.end,id);
  msg(ex===0?L().ex0(nm(id)):ex>=3?L().exFar(nm(id)):L().exN(nm(id),ex));
  if(connected(G.start,G.end,known())){G.done=true;G.won=true;finish()}
  else if(G.guesses.length>=maxG()){G.done=true;G.won=false;finish()}
  save();
  if($("tFacts").checked)showFact(id);
  render();
  const b=R[id].b;if(G.done)fitTo([G.start,G.end,...G.guesses,...solution()]);else if(b[0]<vb.x||b[2]>vb.x+vb.w||b[1]<vb.y||b[3]>vb.y+vb.h)fitTo([G.start,G.end,...G.guesses]);
}
function hint(){if(G.done)return;const p=bestPath(G.start,G.end,known());const id=p.find(x=>!G.guesses.includes(x)&&!G.hints.includes(x))||p.find(x=>!G.guesses.includes(x));
  if(!id)return;if(!G.hints.includes(id))G.hints.push(id);msg(L().hintMsg(L().C[R[id].cc],nm(id)[0]));save();render()}
function giveUp(){if(G.done)return;G.done=true;G.won=false;G.gaveUp=true;finish();save();render();fitTo([G.start,G.end,...G.guesses,...solution()])}
function finish(){overlayOpen=true;
  if(G.mode==="daily"){const st=store.get("sbs-stats")||{played:0,won:0,perfect:0,last:null};if(st.last!==G.date){st.played++;if(G.won)st.won++;if(G.won&&G.guesses.length===D[G.start][G.end]-1&&!G.hints.length&&!G.borders)st.perfect++;st.last=G.date;store.set("sbs-stats",st)}}
  requestAnimationFrame(()=>{const r=$("mapbox").getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)$("mapbox").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})})}

// ---- fact card ----
function showFact(id){const r=R[id];if(!r.facts||!r.facts.length)return;
  let k=Math.floor(Math.random()*r.facts.length);if(factId===id&&r.facts.length>1&&k===factIdx)k=(k+1)%r.facts.length;
  factIdx=k;factId=id;renderFact();render()}
function hideFact(){factId=null;$("fact").hidden=true;for(const el of Object.values(EL))el.classList.remove("focus")}
function renderFact(){const id=factId;if(!id){$("fact").hidden=true;return}const r=R[id],f=r.facts[factIdx][LANG==="ru"?1:0];
  $("fact").innerHTML=`<p><b>${L().btw}</b> ${esc(f)}</p><button class="x" type="button" aria-label="${L().close}" id="fx">×</button>`;
  $("fact").hidden=false;$("fx").onclick=hideFact;
  for(const [k,el] of Object.entries(EL))el.classList.toggle("focus",k===id)}

// ---- render ----
const DOTC=["var(--g0)","var(--g1)","var(--g2)","var(--g3)"];
function render(){
  const l=L(),sp=D[G.start][G.end]-1;
  $("route").innerHTML=`<span class="pt">${esc(nm(G.start))}</span><span class="cc">${G.start.slice(0,2)}</span><span class="arrow">→</span><span class="pt">${esc(nm(G.end))}</span><span class="cc">${G.end.slice(0,2)}</span>`;
  $("cShort").textContent=sp;$("cLeft").textContent=Math.max(0,maxG()-G.guesses.length);
  const sol=solution();
  for(const id of IDS){const el=EL[id];let c="r";let t=null;
    if(id===G.start)c+=" on start",t=1;else if(id===G.end)c+=" on end",t=1;
    else if(G.guesses.includes(id)){c+=" on s"+Math.min(excess(G.start,G.end,id),3);t=1}
    else if(sol.has(id))c+=" sol",t=1;
    else if(G.hints.includes(id))c+=" hinted";
    if(id===factId)c+=" focus";
    el.setAttribute("class",c);el.innerHTML=t?`<title>${esc(nm(id))} · ${esc(R[id].local)}</title>`:""}
  svg.classList.toggle("borders",!!G.borders||G.done);
  $("bordersBtn").textContent=G.borders?l.bordersOn:l.borders;$("bordersBtn").title=l.bordersTip;
  gD.innerHTML="";gL.innerHTML="";
  for(const id of [G.start,G.end,...G.guesses,...sol]){const[x,y]=R[id].c;
    if(SMALL(id)){const c=document.createElementNS(NS,"circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("class","dot");c.dataset.id=id;
      c.style.fill=id===G.start||id===G.end?"var(--accent)":sol.has(id)?"var(--accent-soft)":DOTC[Math.min(excess(G.start,G.end,id),3)];gD.appendChild(c)}
    if($("tLabels").checked||id===G.start||id===G.end){const t=document.createElementNS(NS,"text");t.setAttribute("x",x);t.setAttribute("y",SMALL(id)?y-9*vb.w/1000:y);t.setAttribute("class","lbl");t.textContent=short(id);gL.appendChild(t)}}
  scaleMarks();
  $("guesses").innerHTML=G.guesses.map(id=>`<li data-id="${id}"><i style="background:${DOTC[Math.min(excess(G.start,G.end,id),3)]}"></i>${esc(nm(id))}</li>`).join("")+G.hints.filter(h=>!G.guesses.includes(h)).map(()=>`<li class="h"><i></i>${l.hintBtn}</li>`).join("");
  $("form").hidden=G.done;$("donebar").hidden=!G.done;
  $("over").hidden=!(G.done&&overlayOpen);
  if(G.done){const over=G.guesses.length-sp,perfect=G.won&&over===0&&!G.hints.length&&!G.borders;
    $("panel").classList.toggle("lost",!G.won);$("donebar").classList.toggle("lost",!G.won);
    $("rKick").textContent=G.won?l.kWin:l.kLose;
    $("rTitle").textContent=G.won?(perfect?l.tPerfect:l.tWin):G.gaveUp?l.tGave:l.tOut;
    $("rText").textContent=G.won?l.winText(G.guesses.length,sp,over,G.hints.length,G.borders):l.loseText(bestPath(G.start,G.end,new Set([G.start,G.end])).map(nm).join(" → "));
    $("doneText").textContent=G.won?l.doneWin(G.guesses.length,sp):l.doneLose;
    const sq=["🟩","🟨","🟧","🟥"];
    $("rShare").textContent=`${l.plain}${G.mode==="daily"?" #"+dayNo(G.date):" "+l.shareP}\n${short(G.start)} → ${short(G.end)}\n${G.guesses.map(id=>sq[Math.min(excess(G.start,G.end,id),3)]).join("")}${"💡".repeat(G.hints.length)}${G.borders?"🗺️":""} ${G.won?"✅":"❌"}\n${G.won?(over?l.shareOver(over):l.shareOk):l.shareFail}`;
    $("next").textContent=$("next2").textContent=G.mode==="daily"?l.nextP:l.nextN;
  }
  if(factId)renderFact();
}
function msg(t,err){$("msg").textContent=t;$("msg").classList.toggle("err",!!err)}

function applyLang(){const l=L();document.documentElement.lang=LANG;
  $("h1").innerHTML=l.name;
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=l[el.dataset.t]});
  $("guess").placeholder=l.ph;$("guess").setAttribute("aria-label",l.ph);$("copy").textContent=l.copy;
  $("how").innerHTML=l.how;$("about").innerHTML=l.about;
  $("lEn").setAttribute("aria-pressed",LANG==="en");$("lRu").setAttribute("aria-pressed",LANG==="ru");
  $("divs").innerHTML=["KZ","KG","TJ","TM","UZ"].map(cc=>{const ids=IDS.filter(i=>R[i].cc===cc).sort((a,b)=>nm(a).localeCompare(nm(b),LANG));
    return `<details><summary><span>${l.C[cc]}</span><small>${l.regions(ids.length)}</small></summary><div class="divtable"><table><thead><tr><th>${l.thR}</th><th>${l.thL}</th><th>${l.thC}</th><th>ISO</th></tr></thead><tbody>${ids.map(id=>`<tr><td>${esc(nm(id))}</td><td class="l">${esc(R[id].local)}</td><td class="l">${R[id].cap?esc(R[id].cap[LANG==="ru"?1:0]):"—"}</td><td class="l">${id==="TM-AR"?"—":id}</td></tr>`).join("")}</tbody></table></div></details>`}).join("");
  if(G)render()}
function setLang(x){LANG=x;savePrefs();applyLang();msg("")}
function savePrefs(){store.set("sbs-prefs",{lang:LANG,labels:$("tLabels").checked,facts:$("tFacts").checked})}

// ---- input / suggestions ----
const inp=$("guess"),sug=$("sugg");let items=[],sel=0;
function closeSugg(){sug.hidden=true;items=[]}
function showSugg(){items=search(inp.value);sel=0;if(!items.length||!inp.value.trim()){closeSugg();return}
  sug.innerHTML=items.map((id,i)=>`<li role="option" data-id="${id}" aria-selected="${i===sel}"><span>${esc(nm(id))}</span><span class="loc">${esc(R[id].local)} · ${L().C[R[id].cc]}</span></li>`).join("");sug.hidden=false}
function mark(){[...sug.children].forEach((li,i)=>li.setAttribute("aria-selected",i===sel));sug.children[sel]?.scrollIntoView({block:"nearest"})}
inp.addEventListener("input",showSugg);
inp.addEventListener("keydown",e=>{if(sug.hidden)return;if(e.key==="ArrowDown"){sel=(sel+1)%items.length;mark();e.preventDefault()}else if(e.key==="ArrowUp"){sel=(sel-1+items.length)%items.length;mark();e.preventDefault()}else if(e.key==="Escape")closeSugg()});
sug.addEventListener("pointerdown",e=>{const li=e.target.closest("li");if(li){e.preventDefault();submit(li.dataset.id)}});
inp.addEventListener("blur",()=>setTimeout(closeSugg,120));
function submit(id){if(!id){const q=inp.value.trim();if(!q)return;const r=search(q);if(!r.length){msg(L().unknown(q),true);return}id=items.length?items[sel]:r[0]}
  inp.value="";closeSugg();guess(id);if(!G.done)inp.focus()}
$("form").addEventListener("submit",e=>{e.preventDefault();submit(null)});
$("hint").onclick=hint;$("giveup").onclick=giveUp;
$("bordersBtn").onclick=()=>{if(G.done||G.borders)return;G.borders=true;msg(L().bordersMsg);save();render()};
$("mDaily").onclick=()=>newGame("daily");$("mPractice").onclick=()=>newGame("practice");
$("lEn").onclick=()=>setLang("en");$("lRu").onclick=()=>setLang("ru");
$("next").onclick=$("next2").onclick=()=>newGame("practice");
$("seeMap").onclick=()=>{overlayOpen=false;render()};
$("showRes").onclick=()=>{overlayOpen=true;render();$("mapbox").scrollIntoView({block:"start"})};
$("guesses").addEventListener("click",e=>{const li=e.target.closest("li[data-id]");if(li)showFact(li.dataset.id)});
$("copy").onclick=()=>{const t=$("rShare").textContent;const done=()=>{$("copy").textContent=L().copied;setTimeout(()=>$("copy").textContent=L().copy,1600)};
  try{navigator.clipboard.writeText(t).then(done,selectShare)}catch(e){selectShare()}};
function selectShare(){const r=document.createRange();r.selectNodeContents($("rShare"));const s=getSelection();s.removeAllRanges();s.addRange(r);msg(L().selCopy)}
const prefs=store.get("sbs-prefs")||{};if(prefs.labels===false)$("tLabels").checked=false;if(prefs.facts===false)$("tFacts").checked=false;
$("tLabels").onchange=()=>{savePrefs();render()};$("tFacts").onchange=savePrefs;
window.addEventListener("resize",scaleMarks);

applyLang();
function start(data){if(data&&data.G&&R[data.G.start]){G=data.G;overlayOpen=!!data.overlayOpen;render();fitTo([G.start,G.end,...G.guesses])}else newGame("daily")}
window.claude?.hot?.snapshot?.(()=>({G,overlayOpen}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
</body>
</html>
