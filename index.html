<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steppe by Steppe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --ground:#eceff3; --surface:#fbfcfd; --ink:#16203a; --muted:#5d6884; --faint:#8c96ab;
  --land:#dce2ea; --land-line:#9fabbf; --region-line:#b9c3d3; --hair:#d3d9e3;
  --accent:#2b4bb3; --accent-ink:#ffffff; --accent-soft:#dfe6fb;
  --g0:#2f9e61; --g1:#e1b01c; --g2:#e5792b; --g3:#d24a4a; --hint:#7a4fd0;
  --win:#2f9e61; --lose:#c2413f;
  --label:#16203a; --label-halo:rgba(251,252,253,.92); --scrim:rgba(236,239,243,.72);
  --shadow:0 1px 2px rgba(22,32,58,.06),0 8px 24px rgba(22,32,58,.07);
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0f1522; --surface:#161e30; --ink:#e7ecf6; --muted:#9aa5bd; --faint:#6e7a93;
    --land:#1d273b; --land-line:#4a5873; --region-line:#34415a; --hair:#27324a;
    --accent:#7c98ff; --accent-ink:#0f1522; --accent-soft:#232f52;
    --g0:#3dbb76; --g1:#f0c33a; --g2:#f08b42; --g3:#e86161; --hint:#a98bff;
    --win:#3dbb76; --lose:#e86161;
    --label:#eef2fa; --label-halo:rgba(15,21,34,.9); --scrim:rgba(15,21,34,.66);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0f1522; --surface:#161e30; --ink:#e7ecf6; --muted:#9aa5bd; --faint:#6e7a93;
  --land:#1d273b; --land-line:#4a5873; --region-line:#34415a; --hair:#27324a;
  --accent:#7c98ff; --accent-ink:#0f1522; --accent-soft:#232f52;
  --g0:#3dbb76; --g1:#f0c33a; --g2:#f08b42; --g3:#e86161; --hint:#a98bff;
  --win:#3dbb76; --lose:#e86161;
  --label:#eef2fa; --label-halo:rgba(15,21,34,.9); --scrim:rgba(15,21,34,.66);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:18px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.2vw,32px);letter-spacing:-.01em;margin:0;line-height:1.05}
h1 span{color:var(--accent);cursor:default;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.gsbadge{display:inline-flex;align-items:center;gap:6px;margin-top:6px;border:1px solid #c99a2e;background:color-mix(in srgb,#e7b54a 18%,var(--surface));color:var(--ink);font:700 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 6px 4px 10px;cursor:pointer}
.gsbadge span{font-size:15px;line-height:1;color:var(--muted);letter-spacing:0}
.tag{color:var(--muted);margin:4px 0 0;font-size:13.5px}
.hctl{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:3px}
.seg button{touch-action:manipulation;border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.brief{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.route{font-size:clamp(17px,2.6vw,22px);font-weight:600;text-wrap:balance;margin:0}
.route .pt{color:var(--accent)}
.route .arrow{color:var(--faint);font-weight:400;margin:0 .25em}
.cc{font:600 10.5px var(--body);letter-spacing:.08em;color:var(--muted);border:1px solid var(--hair);border-radius:4px;padding:1px 4px;vertical-align:3px;margin-left:4px}
.counts{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.count{display:flex;flex-direction:column;align-items:flex-end}
.count b{font-family:var(--display);font-size:22px;font-weight:500;line-height:1}
.count small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.mapbox{scroll-margin-top:12px;position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mapwrap{position:relative;touch-action:none}
svg#map{display:block;width:100%;height:clamp(300px,62vh,620px);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
svg#map.drag{cursor:grabbing}
.ctry{fill:var(--land);stroke:var(--land-line);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.r{fill:transparent;stroke:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .35s}
.borders .r{stroke:var(--region-line);stroke-width:.7}
.r.on{stroke:var(--surface);stroke-width:1;cursor:pointer}
.r.start,.r.end{fill:var(--accent)}
.r.s0{fill:var(--g0)} .r.s1{fill:var(--g1)} .r.s2{fill:var(--g2)} .r.s3{fill:var(--g3)}
.r.hinted{fill:transparent;stroke:var(--hint);stroke-width:2;stroke-dasharray:5 4}
.r.sol{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6;stroke-dasharray:4 3;cursor:pointer}
.r.focus{stroke:var(--ink);stroke-width:2.2}
.dot{stroke:var(--surface);vector-effect:non-scaling-stroke;stroke-width:1.2;cursor:pointer}
.lbl{font-family:var(--body);font-weight:600;fill:var(--label);paint-order:stroke;stroke:var(--label-halo);stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoom button{width:34px;height:34px;border-radius:9px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);font:600 17px var(--body);cursor:pointer;display:grid;place-items:center}
.legend{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:5px 9px;border-radius:8px;border:1px solid var(--hair);max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* fact line */
.fact{position:absolute;left:10px;top:10px;max-width:min(380px,calc(100% - 64px));background:var(--surface);border:1px solid var(--hair);border-radius:10px;box-shadow:var(--shadow);padding:8px 8px 8px 12px;display:flex;gap:8px;align-items:flex-start;z-index:2;font-size:14px;line-height:1.4}
.fact p{margin:0}
.fact b{color:var(--accent);font-weight:700}
.fact .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 2px;margin-top:1px}

/* statistics */
.stats{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.stats:empty{display:none}
.st-g{background:var(--accent-soft);border-radius:9px;padding:8px 10px;color:var(--ink)}
.st-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-top:4px}
.st-h2{font-size:12px;color:var(--muted)}
.st-none{margin:0;color:var(--muted)}
.st-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.st-nums b{display:block;font-family:var(--display);font-weight:500;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.st-nums small{color:var(--muted);font-size:11px}
.st-dist{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;font-variant-numeric:tabular-nums}
.st-dist span{font-size:12px;color:var(--muted);text-align:right}
.st-dist .bar{background:var(--faint);color:var(--surface);font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px;text-align:right;min-width:22px}
.st-dist .bar.me{background:var(--g0)}
.st-dist .bar.x.me{background:var(--lose)}
details.box .stats{margin-top:10px;max-width:520px}

/* result overlay */
.over{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px;z-index:3}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;border-top:6px solid var(--win)}
.panel.lost{border-top-color:var(--lose)}
.panel .kick{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--win)}
.panel.lost .kick{color:var(--lose)}
.panel h2{font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,28px);margin:0;line-height:1.1}
.panel p{margin:0;color:var(--muted)}
.panel pre{margin:0;font:500 14px/1.5 var(--body);background:var(--ground);border-radius:9px;padding:10px 12px;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{border:0;background:none;color:var(--muted);font:600 13.5px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 2px}

.play{display:flex;gap:8px;flex-wrap:wrap}
.field{position:relative;flex:1 1 280px}
.field input{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--hair);border-radius:11px;padding:12px 14px;outline:none}
.field input:focus{border-color:var(--accent)}
.sugg{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--hair);border-radius:11px;box-shadow:var(--shadow);list-style:none;margin:0;padding:4px;z-index:5;max-height:min(320px,50vh);overflow:auto;overscroll-behavior:contain}
.sugg li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;cursor:pointer}
.sugg li[aria-selected="true"]{background:var(--accent-soft)}
.sugg li.hd{cursor:default;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:10px 10px 4px;border-top:1px solid var(--hair);border-radius:0;margin-top:2px}
.sugg li.hd:first-child{border-top:0;margin-top:0}
.sugg li.used span:first-child{color:var(--faint)}
.sugg .loc{color:var(--muted);font-size:12.5px;text-align:right}
.btn{touch-action:manipulation;font:600 14.5px var(--body);border-radius:11px;padding:0 16px;min-height:46px;cursor:pointer;border:1.5px solid var(--hair);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.donebar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--hair);border-left:6px solid var(--win);border-radius:11px;padding:8px 8px 8px 14px}
.donebar.lost{border-left-color:var(--lose)}
.donebar b{flex:1 1 200px;font-size:15px}
.msg{min-height:20px;font-size:13.5px;color:var(--muted);margin:-4px 2px 0}
.msg.err{color:var(--g3)}
.guesses{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.guesses li{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:5px 11px 5px 7px;font-size:13.5px;font-weight:500;cursor:pointer}
.guesses li i{width:12px;height:12px;border-radius:50%}
.guesses li.h{cursor:default}
.guesses li.h i{background:transparent;border:2px dashed var(--hint)}
.toggles{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toggles input{accent-color:var(--accent);width:16px;height:16px}
details.box{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:12px 16px}
details.box > summary{cursor:pointer;font-weight:600}
details.box p,details.box li{color:var(--muted);font-size:14px;max-width:72ch}
details.box ul{padding-left:18px}
.divtable{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%;min-width:420px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.l{color:var(--muted)}
.ctylist{display:flex;flex-direction:column;gap:6px}
.ctylist details{border-radius:10px;background:var(--ground);border:1px solid var(--hair)}
.ctylist summary{padding:9px 14px;display:flex;justify-content:space-between;gap:10px;list-style:none;cursor:pointer;font-weight:600}
.ctylist summary::-webkit-details-marker{display:none}
.ctylist summary::before{content:"▸";color:var(--faint);margin-right:8px;transition:transform .2s;display:inline-block}
.ctylist details[open] summary::before{transform:rotate(90deg)}
.ctylist summary span{flex:1}
.ctylist summary small{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.ctylist .divtable{padding:0 14px 10px}
@media (max-width:640px){
  body{padding-block:12px 32px}
  .wrap{gap:10px}
  header{align-items:flex-start}
  .tag{font-size:12.5px}
  .hctl{width:100%;justify-content:space-between}
  .seg button{padding:6px 11px;font-size:12.5px}
  .brief{flex-wrap:nowrap;align-items:flex-start;gap:10px}
  .route{font-size:16px;flex:1;min-width:0}
  .counts{gap:10px;flex-shrink:0}.count b{font-size:18px}.count small{font-size:9.5px;letter-spacing:.04em;text-align:right;max-width:64px;line-height:1.15}
  svg#map{height:min(58vh,480px)}
  .legend{position:static;border:0;border-top:1px solid var(--hair);border-radius:0;background:var(--surface);max-width:none;padding:6px 10px;font-size:10.5px;gap:4px 10px}
  .zoom button{width:38px;height:38px}
  .fact{position:static;max-width:none;border:0;border-top:1px solid var(--hair);border-radius:0;box-shadow:none}
  .play{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .play .field{grid-column:1/-1}
  .play .btn{padding:0 6px;font-size:13px;min-height:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .donebar{padding:8px}
  .donebar b{flex-basis:100%}
  .donebar .btn{flex:1}
  .panel{padding:16px}
  .panel pre{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.r{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="h1"></h1>
      <p class="tag" id="tagline"></p>
      <button class="gsbadge" id="gsBadge" type="button" hidden></button>
    </div>
    <div class="hctl">
      <div class="seg" role="group" aria-label="Game mode">
        <button id="mDaily" aria-pressed="true" data-t="daily"></button>
        <button id="mPractice" aria-pressed="false" data-t="practice"></button>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button id="lEn" aria-pressed="true" lang="en">ENG</button>
        <button id="lRu" aria-pressed="false" lang="ru">РУС</button>
        <button id="lKk" aria-pressed="false" lang="kk">ҚАЗ</button>
      </div>
    </div>
  </header>

  <div class="brief">
    <p class="route" id="route"></p>
    <div class="counts">
      <div class="count"><b id="cShort">–</b><small data-t="shortest"></small></div>
      <div class="count"><b id="cLeft">–</b><small data-t="left"></small></div>
    </div>
  </div>

  <div class="mapbox" id="mapbox">
    <div class="mapwrap">
      <svg id="map" viewBox="0 0 1000 770" role="img" aria-label="Map">
        <g id="gCtry"></g><g id="gReg"></g><g id="gDots"></g><g id="gLbl"></g>
      </svg>
      <div class="zoom">
        <button id="zIn" aria-label="Zoom in">+</button>
        <button id="zOut" aria-label="Zoom out">−</button>
        <button id="zFit" aria-label="Fit route" style="font-size:13px">⤢</button>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i style="background:var(--g0)"></i><span data-t="lg0"></span></span>
        <span><i style="background:var(--g1)"></i><span data-t="lg1"></span></span>
        <span><i style="background:var(--g2)"></i><span data-t="lg2"></span></span>
        <span><i style="background:var(--g3)"></i><span data-t="lg3"></span></span>
      </div>
      <div class="over" id="over" hidden>
        <div class="panel" id="panel" role="dialog" aria-labelledby="rTitle">
          <div class="kick" id="rKick"></div>
          <h2 id="rTitle"></h2>
          <p id="rText"></p>
          <pre id="rShare"></pre>
          <div class="stats" id="rStats"></div>
          <div class="row">
            <button class="btn primary" id="copy" type="button"></button>
            <button class="btn" id="next" type="button"></button>
            <button class="linkbtn" id="seeMap" type="button" data-t="seeMap"></button>
          </div>
        </div>
      </div>
    </div>
    <aside class="fact" id="fact" hidden aria-live="polite"></aside>
  </div>

  <form class="play" id="form" autocomplete="off">
    <div class="field">
      <input id="guess" type="text" aria-autocomplete="list" aria-controls="sugg" spellcheck="false">
      <ul class="sugg" id="sugg" role="listbox" hidden></ul>
    </div>
    <button class="btn primary" id="go" type="submit" data-t="guessBtn"></button>
    <button class="btn" id="hint" type="button" data-t="hintBtn"></button>
    <button class="btn" id="bordersBtn" type="button"></button>
    <button class="btn" id="giveup" type="button" data-t="giveUp"></button>
  </form>
  <div class="donebar" id="donebar" hidden>
    <b id="doneText"></b>
    <button class="btn" id="showRes" type="button" data-t="showResult"></button>
    <button class="btn primary" id="next2" type="button"></button>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>

  <ul class="guesses" id="guesses"></ul>

  <div class="toggles">
    <label><input type="checkbox" id="tLabels" checked> <span data-t="labels"></span></label>
    <label><input type="checkbox" id="tFacts" checked> <span data-t="factsToggle"></span></label>
  </div>

  <details class="box"><summary id="statsTitle"></summary><div class="stats" id="statsBox"></div></details>
  <details class="box"><summary data-t="howTitle"></summary><div id="how"></div></details>
  <details class="box"><summary id="listTitle"></summary><div id="about"></div><div id="divs" class="ctylist"></div></details>
</div>

<script>

маг","aliases":["Khentii","Hentii","Хэнтий","Хэнтэй"],"cap":["Chinggis","Чингис","Шыңғыс"],"short":["Khentii","Хэнтий","Хэнтий"],"facts":[["Genghis Khan was born in Khentii, traditionally by the Onon River.","Чингисхан родился в Хэнтэе, по преданию на реке Онон.","Шыңғыс хан Хэнтийде, аңыз бойынша Онон өзенінің бойында туған."],["Khentii's capital was renamed Chinggis in 2013.","центр Хэнтэйского аймака в 2013 году переименовали в Чингис.","Хэнтий аймағының орталығы 2013 жылы Шыңғыс болып өзгертілді."]]},"MN-043":{"cc":"MN","core":false,"en":"Khovd Province","ru":"Кобдоский аймак","kk":"Ховд аймағы","local":"Ховд аймаг","aliases":["Khovd","Hovd","Kobdo","Ховд","Кобдо"],"cap":["Khovd","Ховд","Ховд"],"short":["Khovd","Ховд","Ховд"],"facts":[["Khovd is one of Mongolia's most ethnically diverse provinces.","Кобдоский аймак — один из самых многонациональных в Монголии.","Ховд — Моңғолиядағы ең көпұлтты аймақтардың бірі."]]},"MN-041":{"cc":"MN","core":false,"en":"Khövsgöl Province","ru":"Хубсугульский аймак","kk":"Хөвсгөл аймағы","local":"Хөвсгөл аймаг","aliases":["Khovsgol","Hovsgol","Хубсугул","Хөвсгөл"],"cap":["Mörön","Мурэн","Мөрөн"],"short":["Khövsgöl","Хөвсгөл","Хөвсгөл"],"facts":[["Lake Khövsgöl holds about 70% of Mongolia's fresh water.","в Хубсугуле около 70% пресной воды Монголии.","Хөвсгөл көлінде Моңғолияның тұщы суының шамамен 70%-ы бар."]]},"MN-053":{"cc":"MN","core":false,"en":"Ömnögovi Province","ru":"Южно-Гобийский аймак","kk":"Өмнөговь аймағы","local":"Өмнөговь аймаг","aliases":["Omnogovi","South Gobi","Умнеговь","Өмнөговь"],"cap":["Dalanzadgad","Даланзадгад","Даланзадгад"],"short":["Ömnögovi","Өмнөговь","Өмнөговь"],"facts":[["the first dinosaur eggs known to science were found at the Flaming Cliffs in Ömnögovi.","первые известные науке яйца динозавров нашли у Пылающих утёсов в Южно-Гобийском аймаке.","ғылымға белгілі алғашқы динозавр жұмыртқалары Өмнөговьтағы Жалындаған жартастардан табылған."],["Oyu Tolgoi in Ömnögovi is one of the world's largest copper and gold mines.","Оюу-Толгой в Южно-Гобийском аймаке — одно из крупнейших в мире месторождений меди и золота.","Өмнөговьтағы Оюу-Толгой — әлемдегі ең ірі мыс пен алтын кеніштерінің бірі."]]},"MN-035":{"cc":"MN","core":false,"en":"Orkhon Province","ru":"Орхон","kk":"Орхон аймағы","local":"Орхон аймаг","aliases":["Orkhon","Erdenet","Орхон","Эрдэнэт"],"cap":["Erdenet","Эрдэнэт","Эрдэнэт"],"short":["Orkhon","Орхон","Орхон"],"facts":[["Erdenet grew around one of Asia's largest copper mines.","Эрдэнэт вырос вокруг одного из крупнейших медных рудников Азии.","Эрдэнэт Азиядағы ең ірі мыс кеніштерінің бірінің маңында өсті."]]},"MN-055":{"cc":"MN","core":false,"en":"Övörkhangai Province","ru":"Уверхангайский аймак","kk":"Өвөрхангай аймағы","local":"Өвөрхангай аймаг","aliases":["Ovorkhangai","Uvurkhangai","Уверхангай","Өвөрхангай"],"cap":["Arvaikheer","Арвайхээр","Арвайхээр"],"short":["Övörkhangai","Өвөрхангай","Өвөрхангай"],"facts":[["Karakorum, the Mongol Empire's capital, lies in Övörkhangai.","Каракорум, столица Монгольской империи, находится в Уверхангае.","Моңғол империясының астанасы Қарақорым Өвөрхангайда."],["Erdene Zuu, founded in 1585, is Mongolia's oldest surviving Buddhist monastery.","Эрдэни-Дзу, основанный в 1585 году, — старейший сохранившийся буддийский монастырь Монголии.","1585 жылы негізі қаланған Эрдэнэ-Зуу — Моңғолиядағы сақталған ең көне будда монастыры."]]},"MN-049":{"cc":"MN","core":false,"en":"Selenge Province","ru":"Селенгинский аймак","kk":"Сэлэнгэ аймағы","local":"Сэлэнгэ аймаг","aliases":["Selenge","Сэлэнгэ","Селенга"],"cap":["Sükhbaatar","Сухэ-Батор","Сүхбаатар"],"short":["Selenge","Сэлэнгэ","Сэлэнгэ"],"facts":[["Selenge is Mongolia's breadbasket.","Сэлэнгэ — главная житница Монголии.","Сэлэнгэ — Моңғолияның астықты өлкесі."],["the Selenge River flows from here into Lake Baikal.","отсюда река Селенга течёт в Байкал.","Сэлэнгэ өзені осы жерден Байкалға ағады."]]},"MN-051":{"cc":"MN","core":false,"en":"Sükhbaatar Province","ru":"Сухэ-Баторский аймак","kk":"Сүхбаатар аймағы","local":"Сүхбаатар аймаг","aliases":["Sukhbaatar","Сухэ-Батор","Сүхбаатар"],"cap":["Baruun-Urt","Барун-Урт","Баруун-Урт"],"short":["Sükhbaatar","Сүхбаатар","Сүхбаатар"],"facts":[["Sükhbaatar Province is named after the revolutionary Damdin Sükhbaatar.","Сухэ-Баторский аймак назван в честь революционера Дамдина Сухэ-Батора.","Сүхбаатар аймағы революционер Дамдин Сүхбаатардың құрметіне аталған."]]},"MN-047":{"cc":"MN","core":false,"en":"Töv Province","ru":"Центральный аймак","kk":"Төв аймағы","local":"Төв аймаг","aliases":["Tov","Tuv","Central","Туве","Төв"],"cap":["Zuunmod","Зуунмод","Зуунмод"],"short":["Töv","Төв","Төв"],"facts":[["Töv means 'central': the province surrounds Ulaanbaatar.","Төв значит «центральный»: аймак окружает Улан-Батор.","Төв — «орталық» дегенді білдіреді: аймақ Ұланбатырды қоршап жатыр."],["a 40 m steel statue of Genghis Khan on horseback stands in Töv.","в Центральном аймаке стоит 40-метровая стальная конная статуя Чингисхана.","Төв аймағында Шыңғыс ханның 40 метрлік болат салт атты мүсіні тұр."]]},"MN-046":{"cc":"MN","core":false,"en":"Uvs Province","ru":"Убсунурский аймак","kk":"Увс аймағы","local":"Увс аймаг","aliases":["Uvs","Увс","Убсунур"],"cap":["Ulaangom","Улангом","Улаангом"],"short":["Uvs","Увс","Увс"],"facts":[["Uvs Lake is the largest lake in Mongolia.","Убсу-Нур — самое большое озеро Монголии.","Увс көлі — Моңғолиядағы ең үлкен көл."],["the Uvs Nuur Basin is a UNESCO site shared with Tuva.","Убсунурская котловина — объект ЮНЕСКО, общий с Тувой.","Увс көлі қазаншұңқыры — Тывамен ортақ ЮНЕСКО нысаны."]]},"MN-057":{"cc":"MN","core":false,"en":"Zavkhan Province","ru":"Завханский аймак","kk":"Завхан аймағы","local":"Завхан аймаг","aliases":["Zavkhan","Завхан"],"cap":["Uliastai","Улясутай","Улиастай"],"short":["Zavkhan","Завхан","Завхан"],"facts":[["Otgontenger, the highest peak of the Khangai range, is in Zavkhan.","Отгонтэнгэр, высшая точка Хангая, находится в Завхане.","Хангайдың ең биік шыңы Отгонтэнгэ   how:`<ul>

};
// Language: saved choice, else the browser's preferred languages. Speakers of other
// languages of the region (Uzbek, Kyrgyz, Tajik, Turkmen, Mongolian…) get Russian.
function detectLang(){
  const saved=(store.get("sbs-prefs")||{}).lang;if(LANGS.includes(saved))return saved;
  const prefs=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"]).map(l=>String(l).toLowerCase());
  for(const l of prefs){const b=l.split("-")[0];
    if(b==="kk")return "kk";if(b==="ru")return "ru";if(b==="en")return "en";
    if(["uz","ky","tg","tk","mn","tt","ba","be","uk","az","ka","hy"].includes(b))return "ru"}
  return "en"}
let LANG=detectLang();
const L=()=>T[LANG];
const nm=id=>META[id][LANG];
const short=id=>META[id].short[LI[LANG]];
const fact=f=>f[LI[LANG]];

// ---- map state (Central Asia or the secret Great Steppe map) ----
let MODE, M, R, IDS, D, PAIRS, EL, KEYS, vb;
const svg=$("map"),gC=$("gCtry"),gR=$("gReg"),gD=$("gDots"),gL=$("gLbl");
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/ё/g,"е").replace(/[ʻʼ'’‘`\-.\s]/g,"");
const STRIP=/(^|\s)(region|oblast|oblysy|oblusu|viloyati|welayaty|province|city|shahri|shaary|sheheri|republic of|republic|respublikasi|krai|aimag|область|облысы|облусу|велаят|уәлаяты|аймағы|аймак|аймаг|республика|республикасы|край|өлкесі|город|провинция|провинциясы)(?=\s|$)/gi;
function useMap(mode){
  MODE=mode;M=DATA.maps[mode];IDS=Object.keys(M.geo);R={};
  for(const id of IDS)R[id]={...META[id],...M.geo[id],n:M.adj[id]};
  D={};for(const s of IDS){const d={[s]:0},q=[s];while(q.length){const u=q.shift();for(const v of R[u].n)if(!(v in d)){d[v]=d[u]+1;q.push(v)}}D[s]=d}
  const [lo,hi]=mode==="gs"?[4,11]:[3,8];
  PAIRS=[];for(const a of IDS)for(const b of IDS)if(a<b&&D[a][b]>=lo&&D[a][b]<=hi)PAIRS.push([a,b]);
  KEYS={};for(const id of IDS){const r=META[id];
    KEYS[id]=[...new Set([r.en,r.ru,r.kk,r.local,...r.short,...r.aliases,...[r.en,r.ru,r.kk,r.local].map(s=>s.replace(STRIP," "))].map(norm).filter(Boolean))]}
  gC.innerHTML="";gR.innerHTML="";EL={};
  for(const cc in M.countries){const p=document.createElementNS(NS,"path");p.setAttribute("d",M.countries[cc]);p.setAttribute("class","ctry");gC.appendChild(p)}
  const area=id=>{const b=R[id].b;return (b[2]-b[0])*(b[3]-b[1])};
  for(const id of [...IDS].sort((a,b)=>area(b)-area(a))){const p=document.createElementNS(NS,"path");p.setAttribute("d",R[id].d);p.setAttribute("class","r");p.dataset.id=id;gR.appendChild(p);EL[id]=p}
  vb={x:0,y:0,w:M.W,h:M.W*asp()};
  document.documentElement.dataset.mode=mode;
}
const SMALL=id=>{const b=R[id].b;return Math.max(b[2]-b[0],b[3]-b[1])<9};

// ---- pan & zoom; the viewBox always matches the element's shape ----
const asp=()=>{const w=svg.clientWidth,h=svg.clientHeight;return w&&h?h/w:0.77};
function setVB(v){const W=M.W,H=M.H,a=asp();v.w=Math.max(40,Math.min(W*1.35,v.w));v.h=v.w*a;
  v.x=Math.max(-0.2*W,Math.min(W*1.2-v.w,v.x));v.y=Math.max(-0.2*H,Math.min(H*1.2-v.h,v.y));vb=v;
  svg.setAttribute("viewBox",`${v.x} ${v.y} ${v.w} ${v.h}`);scaleMarks()}
function fitTo(ids,pad=0.16){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const id of ids){const b=R[id].b;x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[2]);y1=Math.max(y1,b[3])}
  const a=asp();let w=Math.max(x1-x0,(y1-y0)/a,M.W*0.15);w*=1+pad*2;const h=w*a;setVB({x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h})}
function zoomAt(f,cx,cy){const w=vb.w*f;if(w<40||w>M.W*1.35)return;setVB({x:cx-(cx-vb.x)*f,y:cy-(cy-vb.y)*f,w,h:w*asp()})}
function toSvg(e){const r=svg.getBoundingClientRect();return[vb.x+(e.clientX-r.left)/r.width*vb.w,vb.y+(e.clientY-r.top)/r.height*vb.h]}
svg.addEventListener("wheel",e=>{e.preventDefault();const[x,y]=toSvg(e);zoomAt(e.deltaY>0?1.18:1/1.18,x,y)},{passive:false});
const ptrs=new Map();let moved=0,downTarget=null;
svg.addEventListener("pointerdown",e=>{downTarget=e.target;svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);svg.classList.add("drag");moved=0});
svg.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const r=svg.getBoundingClientRect();const prev=ptrs.get(e.pointerId);
  moved+=Math.abs(e.clientX-prev[0])+Math.abs(e.clientY-prev[1]);
  if(ptrs.size===1){setVB({...vb,x:vb.x-(e.clientX-prev[0])/r.width*vb.w,y:vb.y-(e.clientY-prev[1])/r.height*vb.h})}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d0=Math.hypot(a[0]-b[0],a[1]-b[1]);ptrs.set(e.pointerId,[e.clientX,e.clientY]);const [c,dd]=[...ptrs.values()];const d1=Math.hypot(c[0]-dd[0],c[1]-dd[1]);
    if(d0>0&&d1>0){const mx=(c[0]+dd[0])/2,my=(c[1]+dd[1])/2;zoomAt(d0/d1,vb.x+(mx-r.left)/r.width*vb.w,vb.y+(my-r.top)/r.height*vb.h)}return}
  ptrs.set(e.pointerId,[e.clientX,e.clientY])});
const up=e=>{const was=ptrs.size;ptrs.delete(e.pointerId);if(!ptrs.size)svg.classList.remove("drag");
  if(e.type==="pointerup"&&was===1&&moved<8&&downTarget){const id=downTarget.dataset&&downTarget.dataset.id;if(id&&isShown(id))showFact(id)}};
svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
$("zIn").onclick=()=>zoomAt(1/1.4,vb.x+vb.w/2,vb.y+vb.h/2);
$("zOut").onclick=()=>zoomAt(1.4,vb.x+vb.w/2,vb.y+vb.h/2);
$("zFit").onclick=()=>fitTo([G.start,G.end,...G.guesses,...G.hints]);
function scaleMarks(){const k=vb.w/Math.max(svg.clientWidth,300);
  for(const c of gD.children)c.setAttribute("r",6*k);
  for(const t of gL.children){t.setAttribute("font-size",12*k);t.setAttribute("stroke-width",3*k)}}
let lastW=0;new ResizeObserver(()=>{const w=svg.clientWidth;if(!w||!vb)return;const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2,k=lastW?vb.w/lastW*w:vb.w;lastW=w;
  setVB({x:cx-k/2,y:cy-k*asp()/2,w:k,h:k*asp()})}).observe(svg);

// ---- game ----
const DAY0=Date.UTC(2026,8,25);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const dayNo=s=>{const[y,m,d]=s.split("-").map(Number);return Math.round((Date.UTC(y,m-1,d)-DAY0)/864e5)+1};
function rng(seed){let a=0;for(const ch of seed)a=Math.imul(a^ch.charCodeAt(0),2654435761)>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(rand){const [a,b]=PAIRS[Math.floor(rand()*PAIRS.length)];return rand()<.5?[a,b]:[b,a]}
const dailyKey=()=>MODE==="gs"?"sbs-daily-gs":"sbs-daily";

let G, factId=null, factIdx=0, overlayOpen=false;
const maxG=()=>D[G.start][G.end]-1+4;
const known=()=>new Set([G.start,G.end,...G.guesses]);
function bestPath(a,b,kn){const cost={},prev={},dq=[a];cost[a]=0;
  while(dq.length){const u=dq.shift();for(const v of R[u].n){const w=cost[u]+(kn.has(v)?0:1);if(!(v in cost)||w<cost[v]){cost[v]=w;prev[v]=u;kn.has(v)?dq.unshift(v):dq.push(v)}}}
  const p=[];for(let u=b;u!==a;u=prev[u])p.unshift(u);p.pop();return p}
function connected(a,b,set){const seen=new Set([a]),q=[a];while(q.length){const u=q.shift();if(u===b)return true;for(const v of R[u].n)if(set.has(v)&&!seen.has(v)){seen.add(v);q.push(v)}}return false}
const excess=(x)=>D[G.start][x]+D[x][G.end]-D[G.start][G.end];
const solution=()=>G.done&&!G.won?new Set(bestPath(G.start,G.end,known())):new Set();
const isShown=id=>id===G.start||id===G.end||G.guesses.includes(id)||solution().has(id);
const valid=g=>g&&R[g.start]&&R[g.end]&&g.guesses.every(x=>R[x]);
function newGame(mode){
  if(mode==="daily"){const t=today();const saved=store.get(dailyKey());
    if(saved&&saved.date===t&&valid(saved)){G=saved}else{const[s,e]=pick(rng((MODE==="gs"?"sbs-gs-":"sbs-")+t));G={mode,date:t,start:s,end:e,guesses:[],hints:[],done:false,won:false}}}
  else{const[s,e]=pick(Math.random);G={mode,start:s,end:e,guesses:[],hints:[],done:false,won:false}}
  $("mDaily").setAttribute("aria-pressed",mode==="daily");$("mPractice").setAttribute("aria-pressed",mode!=="daily");
  GLOBAL=null;fetchGlobal();$("guess").value="";closeSugg();msg("");hideFact();overlayOpen=G.done;render();fitTo(G.done?[G.start,G.end,...G.guesses]:[G.start,G.end]);
}
function save(){if(G.mode==="daily")store.set(dailyKey(),G)}

function guess(id){
  if(G.done)return;
  if(id===G.start||id===G.end){msg(L().already(nm(id)),true);return}
  if(G.guesses.includes(id)){msg(L().dup(nm(id)),true);return}
  G.guesses.push(id);G.hints=G.hints.filter(h=>h!==id);
  const ex=excess(id);
  msg(ex===0?L().ex0(nm(id)):ex>=3?L().exFar(nm(id)):L().exN(nm(id),ex));
  if(connected(G.start,G.end,known())){G.done=true;G.won=true;finish()}
  else if(G.guesses.length>=maxG()){G.done=true;G.won=false;finish()}
  save();
  if($("tFacts").checked)showFact(id);
  render();
  const b=R[id].b;if(G.done)fitTo([G.start,G.end,...G.guesses,...solution()]);else if(b[0]<vb.x||b[2]>vb.x+vb.w||b[1]<vb.y||b[3]>vb.y+vb.h)fitTo([G.start,G.end,...G.guesses]);
}
function hint(){if(G.done)return;const p=bestPath(G.start,G.end,known());const id=p.find(x=>!G.guesses.includes(x)&&!G.hints.includes(x))||p.find(x=>!G.guesses.includes(x));
  if(!id)return;if(!G.hints.includes(id))G.hints.push(id);msg(L().hintMsg(L().C[R[id].cc],nm(id)[0]));save();render()}
function giveUp(){if(G.done)return;G.done=true;G.won=false;G.gaveUp=true;finish();save();render();fitTo([G.start,G.end,...G.guesses,...solution()])}
function finish(){overlayOpen=true;
  if(G.mode==="daily"){recordDaily();sendGlobal()}
  requestAnimationFrame(()=>{const r=$("mapbox").getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)$("mapbox").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})})}

// ---- one-line fact ----
function showFact(id){const f=META[id].facts;if(!f||!f.length)return;
  let k=Math.floor(Math.random()*f.length);if(factId===id&&f.length>1&&k===factIdx)k=(k+1)%f.length;
  factIdx=k;factId=id;render()}
function hideFact(){factId=null;$("fact").hidden=true;if(G)render()}
function renderFact(){const id=factId;if(!id||!META[id].facts[factIdx]){$("fact").hidden=true;return}
  $("fact").innerHTML=`<p><b>${L().btw}</b> ${esc(fact(META[id].facts[factIdx]))}</p><button class="x" type="button" aria-label="${L().close}" id="fx">×</button>`;
  $("fact").hidden=false;$("fx").onclick=hideFact}

// ---- statistics: personal (this browser) and, when STATS_URL is set, everyone's daily results ----
// STATS_URL points at the Cloudflare Worker in worker/ (see README). Empty = personal stats only.
const STATS_URL="";
const statsKey=()=>"sbs-stats-"+MODE;
function loadStats(){const st=store.get(statsKey());if(st)return st;
  const old=MODE==="core"&&store.get("sbs-stats");// earlier versions kept only totals
  return {played:old?old.played:0,won:old?old.won:0,streak:0,best:0,last:null,lastWin:null,dist:[0,0,0,0,0],lost:old?old.played-old.won:0,perfect:old?old.perfect:0}}
function recordDaily(){const st=loadStats();if(st.last===G.date)return;
  const over=G.guesses.length-(D[G.start][G.end]-1),y=new Date(G.date+"T12:00:00");y.setDate(y.getDate()-1);
  const yest=`${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,"0")}-${String(y.getDate()).padStart(2,"0")}`;
  st.played++;st.last=G.date;
  if(G.won){st.won++;st.dist[Math.min(over,4)]++;st.streak=st.lastWin===yest?st.streak+1:1;st.best=Math.max(st.best,st.streak);st.lastWin=G.date;
    if(over===0&&!G.hints.length&&!G.borders)st.perfect++}
  else{st.lost++;st.streak=0}
  store.set(statsKey(),st)}
let GLOBAL=null;
const statsOn=()=>STATS_URL&&!/(^|\.)claude\.ai$/.test(location.hostname);
function clientId(){let id=store.get("sbs-cid");if(!id){id=Math.random().toString(36).slice(2)+Date.now().toString(36);store.set("sbs-cid",id)}return id}
function fetchGlobal(){if(!statsOn()||!G||G.mode!=="daily")return;const g=G;
  fetch(`${STATS_URL}/stats?day=${g.date}&map=${MODE}&route=${g.start}>${g.end}`,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&G===g){GLOBAL=j;renderStats()}}).catch(()=>{})}
function sendGlobal(){if(!statsOn())return;const sp=D[G.start][G.end]-1;
  fetch(`${STATS_URL}/result`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({day:G.date,map:MODE,route:`${G.start}>${G.end}`,client:clientId(),
    guesses:G.guesses.length,shortest:sp,won:!!G.won,hints:G.hints.length,borders:!!G.borders})}).then(()=>fetchGlobal()).catch(()=>{})}
function statsHTML(){const l=L(),st=loadStats(),n=st.played,pct=n?Math.round(st.won/n*100):0;
  let h="";
  if(GLOBAL&&G&&G.mode==="daily"){h+=`<div class="st-g"><b>${l.stToday}</b>: ${GLOBAL.played?l.stGlobal(GLOBAL.played,Math.round(GLOBAL.won/GLOBAL.played*100),GLOBAL.avgOver==null?null:(+GLOBAL.avgOver).toFixed(1)):l.stGlobalNone}</div>`}
  h+=`<div class="st-h">${l.stMine}${MODE==="gs"?" · "+l.gsBadge:""}</div>`;
  if(!n)return h+`<p class="st-none">${l.stNone}</p>`;
  h+=`<div class="st-nums">${[[n,l.stPlayed],[pct,l.stWin],[st.streak,l.stStreak],[st.best,l.stBest]].map(([v,k])=>`<div><b>${v}</b><small>${k}</small></div>`).join("")}</div>`;
  const rows=[["+0",st.dist[0],l.stPerfect],["+1",st.dist[1]],["+2",st.dist[2]],["+3",st.dist[3]],["+4",st.dist[4]],["✗",st.lost,l.stLost]];
  const mx=Math.max(1,...rows.map(r=>r[1]));
  const me=G&&G.mode==="daily"&&G.done&&G.date===st.last?(G.won?Math.min(G.guesses.length-(D[G.start][G.end]-1),4):5):-1;
  h+=`<div class="st-h2">${l.stDist}</div><div class="st-dist">${rows.map(([k,v],i)=>`<span>${k}</span><div class="bar${i===me?" me":""}${i===5?" x":""}" style="width:${Math.max(6,v/mx*100)}%">${v}</div>`).join("")}</div>`;
  return h}
function renderStats(){$("statsBox").innerHTML=statsHTML();$("rStats").innerHTML=G&&G.mode==="daily"?statsHTML():""}

// ---- render ----
const DOTC=["var(--g0)","var(--g1)","var(--g2)","var(--g3)"];
function render(){
  const l=L(),sp=D[G.start][G.end]-1;
  $("route").innerHTML=`<span class="pt">${esc(nm(G.start))}</span><span class="cc">${G.start.slice(0,2)}</span><span class="arrow">→</span><span class="pt">${esc(nm(G.end))}</span><span class="cc">${G.end.slice(0,2)}</span>`;
  $("cShort").textContent=sp;$("cLeft").textContent=Math.max(0,maxG()-G.guesses.length);
  const sol=solution();
  for(const id of IDS){const el=EL[id];let c="r",t=0;
    if(id===G.start)c+=" on start",t=1;else if(id===G.end)c+=" on end",t=1;
    else if(G.guesses.includes(id)){c+=" on s"+Math.min(excess(id),3);t=1}
    else if(sol.has(id))c+=" sol",t=1;
    else if(G.hints.includes(id))c+=" hinted";
    if(id===factId)c+=" focus";
    el.setAttribute("class",c);el.innerHTML=t?`<title>${esc(nm(id))} · ${esc(META[id].local)}</title>`:""}
  svg.classList.toggle("borders",!!G.borders||G.done);
  $("bordersBtn").textContent=G.borders?l.bordersOn:l.borders;$("bordersBtn").title=l.bordersTip;
  gD.innerHTML="";gL.innerHTML="";
  for(const id of [G.start,G.end,...G.guesses,...sol]){const[x,y]=R[id].c;
    if(SMALL(id)){const c=document.createElementNS(NS,"circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("class","dot");c.dataset.id=id;
      c.style.fill=id===G.start||id===G.end?"var(--accent)":sol.has(id)?"var(--accent-soft)":DOTC[Math.min(excess(id),3)];gD.appendChild(c)}
    if($("tLabels").checked||id===G.start||id===G.end){const t=document.createElementNS(NS,"text");t.setAttribute("x",x);t.setAttribute("y",SMALL(id)?y-10*vb.w/Math.max(svg.clientWidth,300):y);t.setAttribute("class","lbl");t.textContent=short(id);gL.appendChild(t)}}
  scaleMarks();
  $("guesses").innerHTML=G.guesses.map(id=>`<li data-id="${id}"><i style="background:${DOTC[Math.min(excess(id),3)]}"></i>${esc(nm(id))}</li>`).join("")+G.hints.filter(h=>!G.guesses.includes(h)).map(()=>`<li class="h"><i></i>${l.hintBtn}</li>`).join("");
  $("form").hidden=G.done;$("donebar").hidden=!G.done;
  $("over").hidden=!(G.done&&overlayOpen);
  if(G.done){const over=G.guesses.length-sp,perfect=G.won&&over===0&&!G.hints.length&&!G.borders;
    $("panel").classList.toggle("lost",!G.won);$("donebar").classList.toggle("lost",!G.won);
    $("rKick").textContent=G.won?l.kWin:l.kLose;
    $("rTitle").textContent=G.won?(perfect?l.tPerfect:l.tWin):G.gaveUp?l.tGave:l.tOut;
    $("rText").textContent=G.won?l.winText(G.guesses.length,sp,over,G.hints.length,G.borders):l.loseText(bestPath(G.start,G.end,new Set([G.start,G.end])).map(nm).join(" → "));
    $("doneText").textContent=G.won?l.doneWin(G.guesses.length,sp):l.doneLose;
    const sq=["🟩","🟨","🟧","🟥"];
    $("rShare").textContent=`Steppe by Steppe${MODE==="gs"?" · "+l.gsBadge:""}${G.mode==="daily"?" #"+dayNo(G.date):" "+l.shareP}\n${short(G.start)} → ${short(G.end)}\n${G.guesses.map(id=>sq[Math.min(excess(id),3)]).join("")}${"💡".repeat(G.hints.length)}${G.borders?"🗺️":""} ${G.won?"✅":"❌"}\n${G.won?(over?l.shareOver(over):l.shareOk):l.shareFail}`;
    $("next").textContent=$("next2").textContent=G.mode==="daily"?l.nextP:l.nextN;
  }
  renderFact();renderStats();
}
function msg(t,err){$("msg").textContent=t;$("msg").classList.toggle("err",!!err)}

function applyLang(){const l=L();document.documentElement.lang=LANG;
  $("h1").innerHTML='Steppe <span id="by">by</span> Steppe';$("by").onclick=secretTap;
  $("tagline").textContent=MODE==="gs"?l.taglineGs:l.tagline;
  $("gsBadge").hidden=MODE!=="gs";$("gsBadge").innerHTML=`${l.gsBadge} <span aria-hidden="true">×</span>`;$("gsBadge").title=l.gsExit;$("gsBadge").setAttribute("aria-label",`${l.gsBadge}: ${l.gsExit}`);
  document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=l[el.dataset.t]});
  $("guess").placeholder=l.ph;$("guess").setAttribute("aria-label",l.ph);$("copy").textContent=l.copy;
  $("how").innerHTML=l.how;$("about").innerHTML=l.about+(MODE==="gs"?l.aboutGs:"");$("listTitle").textContent=l.listTitle(IDS.length);$("statsTitle").textContent=l.stTitle;
  $("lEn").setAttribute("aria-pressed",LANG==="en");$("lRu").setAttribute("aria-pressed",LANG==="ru");$("lKk").setAttribute("aria-pressed",LANG==="kk");
  const ccs=[...new Set(IDS.map(i=>R[i].cc))];
  $("divs").innerHTML=ccs.map(cc=>{const ids=IDS.filter(i=>R[i].cc===cc).sort((a,b)=>nm(a).localeCompare(nm(b),LANG));
    return `<details><summary><span>${l.C[cc]}</span><small>${l.regions(ids.length)}</small></summary><div class="divtable"><table><thead><tr><th>${l.thR}</th><th>${l.thL}</th><th>${l.thC}</th><th>ISO</th></tr></thead><tbody>${ids.map(id=>`<tr><td>${esc(nm(id))}</td><td class="l">${esc(META[id].local)}</td><td class="l">${META[id].cap?esc(META[id].cap[LI[LANG]]):"—"}</td><td class="l">${id==="TM-AR"?"—":id}</td></tr>`).join("")}</tbody></table></div></details>`}).join("");
  if(G)render()}
function setLang(x){LANG=x;savePrefs();applyLang();msg("")}
function savePrefs(){store.set("sbs-prefs",{lang:LANG,labels:$("tLabels").checked,facts:$("tFacts").checked})}

// ---- secret Great Steppe map: tap "by" five times, or open the page with #greatsteppe ----
let taps=[];
function secretTap(){const now=Date.now();taps=taps.filter(t=>now-t<2500);taps.push(now);if(taps.length>=5){taps=[];switchMap(MODE==="gs"?"core":"gs")}}
function switchMap(mode){useMap(mode);store.set("sbs-map",mode);
  try{history.replaceState(null,"",mode==="gs"?"#greatsteppe":location.pathname+location.search)}catch(e){}
  applyLang();newGame("daily");if(mode==="gs")msg(L().gsOn)}
$("gsBadge").onclick=()=>switchMap("core");

// ---- input / suggestions ----
const inp=$("guess"),sug=$("sugg");let items=[],sel=0,navd=false;
// Typing a country (or its people: "Kazakh", "узбек", "қазақ") lists all of its regions.
const CTRY_WORDS={KZ:["kazakh","kazak","казах","қазақ"],KG:["kyrgyz","kirghiz","кыргыз","киргиз","қырғыз"],TJ:["tajik","таджик","тәжік"],
  TM:["turkmen","туркмен","түрікмен"],UZ:["uzbek","узбек","өзбек"],RU:["russia","росси","ресей"],CN:["china","chinese","китай","қытай"],MN:["mongolia","монголи","моңғолия"]};
let sugCountry=null;
function countryOf(q){const nq=norm(q);if(nq.length<3)return null;
  for(const cc of new Set(IDS.map(i=>R[i].cc))){const keys=[...LANGS.map(l=>T[l].C[cc]),...(CTRY_WORDS[cc]||[])].map(norm);
    if(keys.some(k=>k.startsWith(nq)||nq.startsWith(k)&&nq.length<=k.length+4))return cc}
  return null}
function search(q,all){const nq=norm(q),n2=norm(q.replace(STRIP," "));sugCountry=null;if(!nq)return[];
  const out=[];for(const id of IDS){let best=9;for(const k of KEYS[id])for(const t of [nq,n2]){if(!t)continue;
    if(k===t)best=Math.min(best,0);else if(k.startsWith(t))best=Math.min(best,1);else if(k.includes(t))best=Math.min(best,3)}
    if(best<9)out.push([best,id])}
  out.sort((a,b)=>a[0]-b[0]||nm(a[1]).length-nm(b[1]).length||nm(a[1]).localeCompare(nm(b[1])));
  let ids=out.slice(0,8).map(x=>x[1]);
  const cc=all===false?null:countryOf(q);
  if(cc){const rest=IDS.filter(i=>R[i].cc===cc&&!ids.includes(i)).sort((a,b)=>nm(a).localeCompare(nm(b),LANG));
    ids=ids.filter(i=>R[i].cc!==cc||out.find(x=>x[1]===i)[0]===0);sugCountry={cc,at:ids.length};ids=[...ids,...rest.filter(i=>!ids.includes(i))]}
  return ids}
function closeSugg(){sug.hidden=true;items=[]}
function showSugg(){items=search(inp.value);sel=0;navd=false;if(!items.length||!inp.value.trim()){closeSugg();return}
  const used=new Set([G.start,G.end,...G.guesses]);
  sug.innerHTML=items.map((id,i)=>(sugCountry&&i===sugCountry.at?`<li class="hd" role="presentation">${esc(L().C[sugCountry.cc])} · ${L().regions(IDS.filter(x=>R[x].cc===sugCountry.cc).length)}</li>`:"")+
    `<li role="option" data-id="${id}" aria-selected="${i===sel}"${used.has(id)?' class="used"':""}><span>${esc(nm(id))}</span><span class="loc">${esc(META[id].local)} · ${L().C[R[id].cc]}</span></li>`).join("");
  sug.hidden=false;sug.scrollTop=0}
function mark(){sug.querySelectorAll("li[data-id]").forEach((li,i)=>li.setAttribute("aria-selected",i===sel));sug.querySelectorAll("li[data-id]")[sel]?.scrollIntoView({block:"nearest"})}
inp.addEventListener("input",showSugg);
inp.addEventListener("keydown",e=>{if(sug.hidden)return;if(e.key==="ArrowDown"){navd=true;sel=(sel+1)%items.length;mark();e.preventDefault()}else if(e.key==="ArrowUp"){navd=true;sel=(sel-1+items.length)%items.length;mark();e.preventDefault()}else if(e.key==="Escape")closeSugg()});
sug.addEventListener("pointerdown",e=>{e.preventDefault();const li=e.target.closest("li[data-id]");if(li)submit(li.dataset.id)});
inp.addEventListener("blur",()=>setTimeout(closeSugg,150));
function submit(id){if(!id){const q=inp.value.trim();if(!q)return;if(sugCountry&&sugCountry.at===0&&!navd&&items.length){msg(L().pick,true);return}const r=search(q,false);if(!r.length&&!items.length){msg(L().unknown(q),true);return}id=items.length?items[sel]:r[0]}
  inp.value="";closeSugg();guess(id);if(!G.done&&!matchMedia("(pointer: coarse)").matches)inp.focus()}
$("form").addEventListener("submit",e=>{e.preventDefault();submit(null)});
$("hint").onclick=hint;$("giveup").onclick=giveUp;
$("bordersBtn").onclick=()=>{if(G.done||G.borders)return;G.borders=true;msg(L().bordersMsg);save();render()};
$("mDaily").onclick=()=>newGame("daily");$("mPractice").onclick=()=>newGame("practice");
$("lEn").onclick=()=>setLang("en");$("lRu").onclick=()=>setLang("ru");$("lKk").onclick=()=>setLang("kk");
$("next").onclick=$("next2").onclick=()=>newGame("practice");
$("seeMap").onclick=()=>{overlayOpen=false;render()};
$("showRes").onclick=()=>{overlayOpen=true;render();$("mapbox").scrollIntoView({block:"start"})};
$("guesses").addEventListener("click",e=>{const li=e.target.closest("li[data-id]");if(li)showFact(li.dataset.id)});
$("copy").onclick=()=>{const t=$("rShare").textContent;const done=()=>{$("copy").textContent=L().copied;setTimeout(()=>$("copy").textContent=L().copy,1600)};
  try{navigator.clipboard.writeText(t).then(done,selectShare)}catch(e){selectShare()}};
function selectShare(){const r=document.createRange();r.selectNodeContents($("rShare"));const s=getSelection();s.removeAllRanges();s.addRange(r);msg(L().selCopy)}
const prefs=store.get("sbs-prefs")||{};if(prefs.labels===false)$("tLabels").checked=false;if(prefs.facts===false)$("tFacts").checked=false;
$("tLabels").onchange=()=>{savePrefs();render()};$("tFacts").onchange=savePrefs;
addEventListener("hashchange",()=>{const want=/^#(greatsteppe|gs)$/i.test(location.hash)?"gs":null;if(want&&MODE!=="gs")switchMap("gs")});

function start(data){
  const hashGs=/^#(greatsteppe|gs)$/i.test(location.hash);
  useMap(data&&data.MODE?data.MODE:hashGs||store.get("sbs-map")==="gs"?"gs":"core");
  applyLang();
  if(data&&data.G&&valid(data.G)){G=data.G;overlayOpen=!!data.overlayOpen;render();fitTo([G.start,G.end,...G.guesses])}else newGame("daily")}
window.claude?.hot?.snapshot?.(()=>({G,overlayOpen,MODE}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();

</script>
